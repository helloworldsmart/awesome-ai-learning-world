name: touches-done

# Label pull requests that change, rename or delete a resource whose status is
# "done" on the base branch (or that mark something done). It never blocks the
# merge — it makes sure the maintainer sees it.
#
# Security: pull_request_target runs with write access, so this job NEVER checks
# out or executes code from the pull request. It only reads file lists and the
# base branch's copies through the API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            async function statusAt(path, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                return JSON.parse(Buffer.from(data.content, "base64").toString("utf8")).status;
              } catch {
                return null; // file does not exist at that ref, or is not valid JSON
              }
            }

            const hits = [];
            for (const f of files) {
              const path = f.previous_filename ?? f.filename;
              if (!/^(resources|paths)\//.test(path) || !path.endsWith(".json")) continue;
              if ((await statusAt(path, pr.base.sha)) === "done") {
                hits.push(`- \`${path}\` is **done** on \`${pr.base.ref}\` and this PR ${f.status} it`);
              } else if (f.status !== "removed" && (await statusAt(f.filename, pr.head.sha)) === "done") {
                hits.push(`- \`${f.filename}\` is marked **done** by this PR — only the maintainer marks things done`);
              }
            }

            const marker = "<!-- touches-done -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (hits.length === 0) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "touches-done" });
              } catch {}
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: "touches-done" });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: "touches-done", color: "d93f0b",
                description: "Changes a resource the maintainer already verified",
              });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["touches-done"] });

            const body = [
              marker,
              "This pull request touches resources the maintainer has already verified (`status: done`):",
              "",
              ...hits,
              "",
              "That's allowed — it just needs the maintainer's explicit OK before merging.",
            ].join("\n");
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
