name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Unit tests for the validation rules
        run: node --test scripts/
      - name: Validate skills, resources and paths
        run: node scripts/check.mjs
      - name: README is generated from the resources
        run: node scripts/build-readme.mjs --check
